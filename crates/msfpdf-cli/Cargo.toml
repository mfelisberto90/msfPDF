[package]
name = "msfpdf-cli"
description = "Standalone <1 MB JSON-to-%PDF-1.4 CLI compiler with Latin, Russian Cyrillic & connected Arabic RTL support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["pdf", "cli", "invoice", "arabic", "cyrillic"]
categories = ["command-line-utilities", "rendering::data-formats"]

[[bin]]
name = "msfpdf"
path = "src/main.rs"

[dependencies]
msfpdf-core = { path = "../msfpdf-core" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
