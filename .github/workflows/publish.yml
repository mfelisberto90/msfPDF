name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish TypeScript Package to npmjs (OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build showcase browser bundle
        run: npm run build:showcase

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Run TypeScript test suite
        run: npm run test:ts

      - name: Publish to npm with provenance attestation
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    name: Publish Rust Crates to crates.io (OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Clippy checks
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust test suite
        run: cargo test --workspace

      - name: Publish msfpdf-core to crates.io
        run: cargo publish -p msfpdf-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: sleep 25

      - name: Publish msfpdf-cli to crates.io
        run: cargo publish -p msfpdf-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
