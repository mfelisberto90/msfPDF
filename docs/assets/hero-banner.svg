<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">msfPDF v0.2 · Sub-Millisecond Zero-Dependency %PDF-1.4 Vector Engine</title>
  <desc id="bannerDesc">Deterministic PDF generation in Rust and TypeScript with Latin, Russian Cyrillic, connected Arabic RTL, and pure vector QR codes.</desc>
  <rect width="1200" height="380" rx="16" fill="#0a0d14"/>

  <!-- Left Title Tile -->
  <rect x="20" y="20" width="690" height="212" rx="10" fill="#131824"/>
  <text x="48" y="64" fill="#5a9bfc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600" letter-spacing="0.02em">msfPDF v0.2 · RUST + TYPESCRIPT · MIT</text>
  <text x="48" y="128" fill="#e9edf3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.03em">Vector PDFs in 0.52 ms.</text>
  <text x="48" y="172" fill="#9ba7b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="500">Zero runtime dependencies · Zero .ttf files · 100% 7-bit ASCII %PDF-1.4</text>
  <text x="48" y="206" fill="#e9edf3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="500">Native Latin (WinAnsi)  ·  Russian Кириллица (₽ / №)  ·  Connected Arabic العربية RTL</text>

  <!-- Bottom Left Stat Tiles -->
  <rect x="20" y="244" width="224" height="116" rx="10" fill="#5a9bfc"/>
  <text x="42" y="298" fill="#0a0d14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700">0.52 ms</text>
  <text x="42" y="332" fill="#0a0d14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">Median A4 + QR compile</text>

  <rect x="254" y="244" width="224" height="116" rx="10" fill="#1a2233"/>
  <text x="276" y="298" fill="#e9edf3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700">0 deps</text>
  <text x="276" y="332" fill="#9ba7b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="500">810 KB CLI · Edge Worker ready</text>

  <rect x="488" y="244" width="222" height="116" rx="10" fill="#152b38"/>
  <text x="510" y="298" fill="#e9edf3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700">SHA-256</text>
  <text x="510" y="332" fill="#9ba7b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="500">Byte-identical Rust &amp; TS</text>

  <!-- Right Specimen Sheet Card -->
  <rect x="724" y="20" width="456" height="340" rx="10" fill="#131824"/>
  <rect x="748" y="42" width="408" height="296" rx="8" fill="#ffffff"/>
  <rect x="748" y="42" width="408" height="68" rx="8" fill="#0d1f3c"/>
  <rect x="748" y="96" width="408" height="14" fill="#0d1f3c"/>
  <text x="768" y="74" fill="#93c5fd" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">TRILINGUAL VECTOR SPECIMEN</text>
  <text x="768" y="96" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">Invoice / Счёт / فاتورة</text>
  <rect x="1078" y="60" width="60" height="26" rx="5" fill="#2563eb"/>
  <text x="1093" y="78" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700">PAID</text>

  <!-- Specimen multilingual rows -->
  <rect x="768" y="126" width="256" height="46" rx="6" fill="#f1f5f9"/>
  <text x="780" y="145" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">CYRILLIC TYPE 3 SUBSET (2048 UPM)</text>
  <text x="780" y="163" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">Счёт-фактура № 8841 · 288 000 ₽</text>

  <rect x="768" y="182" width="256" height="48" rx="6" fill="#f1f5f9"/>
  <text x="780" y="201" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">CONNECTED ARABIC + UAX #9 BIDI</text>
  <text x="1012" y="220" text-anchor="end" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700">فاتورة ضريبية — لا رسوم إضافية</text>

  <rect x="768" y="242" width="368" height="36" rx="6" fill="#0d1f3c"/>
  <text x="782" y="265" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">Total Due / Итого / الإجمالي</text>
  <text x="1122" y="265" text-anchor="end" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700">$19,425.00</text>

  <!-- Mini Vector QR representation -->
  <rect x="1040" y="126" width="96" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M1054 138h22v22h-22z M1058 142v14h14v-14z M1061 145h8v8h-8z
           M1100 138h22v22h-22z M1104 142v14h14v-14z M1107 145h8v8h-8z
           M1054 184h22v22h-22z M1058 188v14h14v-14z M1061 191h8v8h-8z
           M1082 142h6v6h-6z M1088 154h6v12h-6z M1082 172h18v6h-18z
           M1106 172h12v6h-12z M1084 186h8v8h-8z M1098 192h18v12h-18z M1104 182h8v6h-8z" fill="#0f172a" fill-rule="evenodd"/>
  <text x="1088" y="222" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="600">ISO 18004 QR</text>

  <!-- ASCII xref strip -->
  <text x="768" y="302" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">0000000015 00000 n  ·  /ToUnicode CMap  ·  %%EOF</text>
  <text x="768" y="322" fill="#2563eb" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">Zero SSRF · Zero Headless Browser · AI Schema Ready</text>
