[workspace]
resolver = "2"
members = [
    "crates/msfpdf-core",
    "crates/msfpdf-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Murilo Felisberto <mfelisberto90@users.noreply.github.com>"]
repository = "https://github.com/mfelisberto90/msfPDF"
homepage = "https://mfelisberto90.github.io/msfPDF/"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.2"
libc = "0.2"
ed25519-compact = { version = "2.1", default-features = false, features = ["std", "random"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
